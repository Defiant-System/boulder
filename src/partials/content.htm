<content data-context="game-view">
	<div class="start-view" data-area="start">
		<div class="diamond orange"></div>
		<div class="crystal-ball"></div>

		<div class="buttons">
			<div class="button options" title="Options"></div>
			<div class="button start" title="Start Game" data-click="show-view" data-arg="game"></div>
			<div class="button high-scores" title="High Scores"></div>
		</div>
	</div>

	<div class="game-view" data-area="game">
		<canvas class="game"></canvas>
	</div>
</content>
